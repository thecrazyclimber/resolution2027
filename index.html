<script>
/* ====== CONFIG : colle ici les valeurs de ton projet Supabase ====== */
const CONFIG={url:"https://mtwlzcktblrpxovvqorw.supabase.co",key:"sb_publishable_1OEeZU5UapXiK8-q21q3Zw_DRqUvRMU"};
/* ================================================================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const ls={get:k=>{try{return localStorage.getItem(k)||""}catch(e){return""}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hue=n=>[...n].reduce((a,c)=>a+c.charCodeAt(0)*17,0)%360;
const okImg=x=>/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(x||"");
const av=n=>{const e=(S.entries||[]).find(x=>x.name===n);return e&&okImg(e.img)?`<div class="av" style="background:#222 url(${e.img}) center/cover"></div>`:`<div class="av" style="background:hsl(${hue(n)} 80% 68%)">${esc(n[0]||"?").toUpperCase()}</div>`};
let S={tab:"write",ready:false,pub:"",revealed:false,names:[],entries:[],mode:null,demo:false,err:""};

/* ---------- Crypto : RSA-OAEP + AES-GCM (tout se passe dans le navigateur) ---------- */
async function genKeys(){
  const k=await crypto.subtle.generateKey({name:"RSA-OAEP",modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:"SHA-256"},true,["encrypt","decrypt"]);
  return{pub:b64(await crypto.subtle.exportKey("spki",k.publicKey)),priv:b64(await crypto.subtle.exportKey("pkcs8",k.privateKey))};
}
async function encrypt(pubB64,obj){
  const pub=await crypto.subtle.importKey("spki",ub64(pubB64),{name:"RSA-OAEP",hash:"SHA-256"},false,["encrypt"]);
  const aes=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt"]);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const c=await crypto.subtle.encrypt({name:"AES-GCM",iv},aes,new TextEncoder().encode(JSON.stringify(obj)));
  const k=await crypto.subtle.encrypt({name:"RSA-OAEP"},pub,await crypto.subtle.exportKey("raw",aes));
  return JSON.stringify({k:b64(k),iv:b64(iv),c:b64(c)});
}
async function decryptAll(privB64,rows){
  const priv=await crypto.subtle.importKey("pkcs8",ub64(privB64),{name:"RSA-OAEP",hash:"SHA-256"},false,["decrypt"]);
  const out=[];
  for(const r of rows){
    const d=JSON.parse(r.data);
    const raw=await crypto.subtle.decrypt({name:"RSA-OAEP"},priv,ub64(d.k));
    const aes=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
    const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:ub64(d.iv)},aes,ub64(d.c));
    const j=JSON.parse(new TextDecoder().decode(p));out.push({name:r.name,l:j.l,img:j.img||""});
  }
  return out;
}

/* ---------- API Supabase ---------- */
async function api(fn,args={}){
  const r=await fetch(`${CONFIG.url}/rest/v1/rpc/${fn}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:CONFIG.key,...(CONFIG.key.startsWith("eyJ")?{Authorization:"Bearer "+CONFIG.key}:{})},body:JSON.stringify(args)});
  const t=await r.text(); const j=t?JSON.parse(t):null;
  if(!r.ok) throw new Error(j?.message||"Erreur réseau");
  return j;
}
const sig=()=>JSON.stringify([S.ready,S.revealed,S.names,S.err]);
async function refresh(){
  if(S.demo||!CONFIG.url) return;
  const old=sig();
  try{
    const st=await api("get_state"); Object.assign(S,st); S.err=""; if(!S.revealed)S.entries=[];
    if(S.revealed&&!S.entries.length){const g=await api("get_reveal");S.entries=shuffle(await decryptAll(g.priv,g.entries||[]))}
  }catch(e){S.err=e.message}
  const typing=S.tab==="write"&&document.activeElement&&document.activeElement.tagName==="INPUT";
  if(sig()!==old&&!typing) render();
}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)}

/* ---------- Feux d’artifice & confettis (canvas) ---------- */
const fx=$("#fx"),cx=fx.getContext("2d");let P=[],R=[];
const COL=["#f5c542","#ffe9a3","#ff7eb6","#8fd3ff","#ffffff","#c9a7ff"];
const PAL=[["#ffe9a3","#f5c542"],["#ff7eb6","#ffd1e8"],["#8fd3ff","#ffffff"],["#c9a7ff","#ffe9a3"],["#4be3a0","#ffffff"],["#ff9f43","#ffe9a3"]];
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight}sizeFx();addEventListener("resize",sizeFx);
const scl=()=>Math.max(.6,Math.min(1.3,Math.min(innerWidth,innerHeight)/800));
function spark(x,y,vx,vy,c,r,d,g=.05,f=.985){if(P.length<2800)P.push({t:0,x,y,vx,vy,life:1,d,c,r,g,f})}
function explode(x,y,type,n=120,pw=1){if(reduce)return;
  type=type||["peony","ring","willow","double","heart"][Math.random()*5|0];pw*=scl();
  const [c1,c2]=PAL[Math.random()*PAL.length|0];
  for(let i=0;i<n;i++){const a=Math.random()*6.283,r=i/n*6.283,c=i%2?c1:c2;
    if(type==="heart"){const hx=16*Math.pow(Math.sin(r),3),hy=-(13*Math.cos(r)-5*Math.cos(2*r)-2*Math.cos(3*r)-Math.cos(4*r));spark(x,y,hx*.4*pw,hy*.4*pw,c,2.2,.011,.03,.985)}
    else if(type==="willow")spark(x,y,Math.cos(a)*(1+Math.random()*4.5)*pw,Math.sin(a)*(1+Math.random()*4.5)*pw,i%3?c1:c2,2,.005+Math.random()*.004,.07,.975)
    else if(type==="ring")spark(x,y,Math.cos(r)*6.2*pw,Math.sin(r)*6.2*pw,c,2.4,.012,.04,.972)
    else if(type==="double"){const s=(i%2?3.3:6.6)*pw;spark(x,y,Math.cos(r)*s,Math.sin(r)*s,c,2.4,.012,.04,.972)}
    else{const s=Math.sqrt(Math.random())*7.2*pw;spark(x,y,Math.cos(a)*s,Math.sin(a)*s,c,2.2,.009+Math.random()*.008,.05,.976)}}
  setTimeout(()=>{for(let i=0;i<Math.min(50,n/3);i++){const a=Math.random()*6.283,d=Math.random()*60*pw;spark(x+Math.cos(a)*d,y+Math.sin(a)*d,Math.cos(a)*.6,Math.sin(a)*.6+.3,"#ffffff",1.4,.03+Math.random()*.03,.02,.95)}},420)}
function burst(x,y,n=70,pw=1){explode(x,y,undefined,Math.round(n*1.5),pw*.9)}
function shell(tx,ty,n=170,pw=1.15,delay=0,type){if(reduce)return;setTimeout(()=>{R.push({x0:tx+(Math.random()*160-80),y0:innerHeight+10,tx,ty,t0:performance.now(),dur:950,n,pw,type});sfx.launch()},delay)}
function confetti(n=90){if(reduce)return;for(let i=0;i<n;i++)P.push({t:1,x:Math.random()*innerWidth,y:-10,vx:Math.random()*2-1,vy:2+Math.random()*3,life:1,d:.004,c:COL[Math.random()*COL.length|0],w:6+Math.random()*6,h:3+Math.random()*4,rot:Math.random()*6,vr:Math.random()*.3-.15})}
function flash(a=.4){const f=$("#flash");f.style.setProperty("--a",a);f.classList.remove("go");void f.offsetWidth;f.classList.add("go")}
function shake(){const a=$("#app");a.classList.remove("shk");void a.offsetWidth;a.classList.add("shk")}
function fireworks(n=6){for(let i=0;i<n;i++)shell(innerWidth*(.12+Math.random()*.76),innerHeight*(.12+Math.random()*.38),170,1.15,i*320);confetti(80)}
function megaShow(){const n=9;for(let i=0;i<n;i++)shell(innerWidth*(i+.5)/n,innerHeight*(.14+Math.random()*.3),240,1.4,i*80);}
let READY=false;
(function loop(){if(READY)beatFx();
  cx.globalCompositeOperation="destination-out";cx.fillStyle="rgba(0,0,0,.22)";cx.fillRect(0,0,fx.width,fx.height);
  cx.globalCompositeOperation="lighter";
  const now=performance.now();
  R=R.filter(r=>{const u=(now-r.t0)/r.dur;
    if(u>=1){explode(r.tx,r.ty,r.type,r.n,r.pw);sfx.pop();flash(.2);return false}
    const e=1-(1-u)*(1-u),x=r.x0+(r.tx-r.x0)*u,y=r.y0+(r.ty-r.y0)*e;
    spark(x+(Math.random()-.5)*2,y,(Math.random()-.5)*.8,.6+Math.random()*.8,"#ffe9a3",1.6,.05,0,.9);
    cx.globalAlpha=1;cx.fillStyle="#fff";cx.beginPath();cx.arc(x,y,2.8,0,6.283);cx.fill();return true});
  P=P.filter(p=>p.life>0);
  for(const p of P){p.x+=p.vx;p.y+=p.vy;p.life-=p.d;cx.globalAlpha=Math.max(p.life,0);cx.fillStyle=p.c;
    if(p.t){p.rot+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);cx.restore()}
    else{p.vy+=p.g;p.vx*=p.f;p.vy*=p.f;cx.beginPath();cx.arc(p.x,p.y,p.r*(.4+p.life*.8),0,6.283);cx.fill()}}
  requestAnimationFrame(loop)})();

function startQ(){Q={order:shuffle([...S.entries]),i:0,score:0,wrong:[],done:false,k:1,fresh:true,gain:0};S.mode="q";render()}
function viewQ(){
  if(Q.i>=Q.order.length) return `<div class="card center"><h2>Fin de la partie 🥂</h2><p class=big style="font-size:3rem">${Q.score} pts</p><button class=pri onclick="S.mode=null;render()">Retour au menu</button></div>`;
  const e=Q.order[Q.i],n=e.l.length;
  return `<p class="muted center">Mystère ${Q.i+1}/${Q.order.length} · Score <b>${Q.score}</b> pts</p>
  <div class=card>${clueHtml(e,Q.done?n:Q.k,Q.fresh)}
  <p class=center>${Q.done?`<span class=pts>+${Q.gain} pts</span>`:`<span class=pts>Jusqu’à ${avail()} pt${avail()>1?"s":""}</span>`}</p></div>
  ${Q.done?`<div class=center><div class=name style="font-size:2.6rem">${esc(e.name)} !</div><p><button class=pri onclick="nextQ()">Mystère suivant →</button></p></div>`
  :`<p class=center>${Q.k<n?`<button onclick="clueQ()">💡 Indice suivant</button>`:`<span class=muted>Tous les indices sont dévoilés</span>`}</p>
  <div class=grid>${S.entries.map((p,i)=>`<button class="face ${Q.wrong.includes(p.name)?"ko":""}" onclick="guess(${i})">${av(p.name)}${esc(p.name)}</button>`).join("")}</div>`}`;
}
function clueQ(){Q.k++;Q.fresh=true;sfx.tick();render()}
function nextQ(){Q.i++;Q.k=1;Q.fresh=true;Q.done=false;Q.wrong=[];render()}
function guess(i){if(Q.done)return;const p=S.entries[i],e=Q.order[Q.i];
  if(p.name===e.name){Q.gain=avail();Q.score+=Q.gain;Q.done=true;Q.fresh=false;sfx.ok();fireworks(3);confetti(60);popOk(e)}
  else if(!Q.wrong.includes(p.name)){Q.wrong.push(p.name);Q.fresh=false;sfx.ko();popKo(p)}
  render()}
function showPop(html,auto){closePop();const d=document.createElement("div");d.id="pop";d.innerHTML=html;d.onclick=e=>{if(e.target===d)closePop()};document.body.append(d);if(auto)setTimeout(()=>{if($("#pop")===d)closePop()},auto)}
function closePop(){const d=$("#pop");if(d)d.remove()}
function popOk(e){const last=Q.i+1>=Q.order.length;showPop(`<div class="pop-card ok"><div class=pop-kicker>🎉 Bravo ! 🎉</div><div class=pop-av>${av(e.name)}</div><div class=pop-name>${esc(e.name)}</div><div class=pop-pts>+${Q.gain} pt${Q.gain>1?"s":""}</div><div class=pop-res>${e.l.map((x,j)=>`<p><span class=num>${j+1}</span>${esc(x)}</p>`).join("")}</div><button class=pri onclick="closePop();nextQ()">${last?"🏆 Voir le score":"Mystère suivant →"}</button></div>`)}
function popKo(p){showPop(`<div class="pop-card ko"><div class=pop-kicker>❌ Raté !</div><div class=pop-av>${av(p.name)}</div><div class=pop-sub>Ce n’est pas <b>${esc(p.name)}</b>…</div></div>`,1500)}

/* Mode 2 : Cartes */
function viewC(){return `<p><button onclick="S.mode=null;render()">← Menu</button></p><div class=cards>${S.entries.map(e=>`<div class=flip onclick="flipCard(this)"><div><div class=f>🎁</div><div class=b>${av(e.name)}<b style="font-size:1.1rem;color:var(--gold2)">${esc(e.name)}</b>${e.l.map(x=>`<span>• ${esc(x)}</span>`).join("")}</div></div></div>`).join("")}</div>`}
function flipCard(el){el.classList.toggle("on");if(el.classList.contains("on")){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,50);sfx.ok()}}

/* Mode 3 : Grand spectacle (résolution par résolution, nom en dernier) */
let T={i:-1,k:0,name:false,busy:false,fresh:false};
function startS(){T={i:-1,k:0,name:false,busy:false,fresh:false};S.mode="s";render()}
function viewS(){
  const n=S.entries.length;
  if(T.i<0) return `<p><button onclick="S.mode=null;render()">← Menu</button></p><div class="stage"><div class=name>Prêt·e·s ?</div><p class=muted>${n} mystère${n>1?"s":""} à découvrir, une résolution à la fois.</p></div><p class=center><button class=pri onclick="actS()">🎆 Lancer le spectacle</button></p>`;
  if(T.i>=n) return `<div class="stage"><div class=name>Bonne année 2027 ! 🥂</div><p class=muted>Rendez-vous le 31 décembre 2027 pour le bilan…</p></div><p class=center><button class=pri onclick="fireworks(8)">🎇 Encore des feux d’artifice</button> <button onclick="S.mode=null;render()">Menu</button></p>`;
  const e=S.entries[T.i],last=T.k>=e.l.length;
  return `<p><button onclick="S.mode=null;render()">← Menu</button> <span class=muted>Mystère ${T.i+1}/${n}</span></p>
  <div class=stage>${T.name?`<div class=pop-av>${av(e.name)}</div><div class=name>${esc(e.name)}</div>`:`<div class=mystery>❓ Qui est-ce ?</div>`}
  ${e.l.slice(0,T.k).map((x,j)=>`<p class="res clue ${j===T.k-1&&T.fresh?"new":""}"><span class=num>${j+1}</span>${esc(x)}</p>`).join("")}</div>
  <p class=center>${T.name?`<button class=pri onclick="actS()">${T.i+1>=n?"🎉 Grand finale":"Personne suivante →"}</button>`
    :`<button class=pri onclick="actS()">${last?"✨ Révéler le nom":"💡 Indice suivant"}</button> ${last?"":`<button class=ghost onclick="skipS()">Révéler maintenant</button>`}`}</p>`;
}
async function revealName(){await countdown();T.name=true;T.k=S.entries[T.i].l.length;T.fresh=false;fireworks(3)}
async function actS(){if(T.busy)return;T.busy=true;const n=S.entries.length;
  if(T.i<0){await countdown();T.i=0;T.k=1;T.fresh=true;sfx.ok()}
  else if(!T.name){const e=S.entries[T.i];if(T.k<e.l.length){T.k++;T.fresh=true;sfx.ok()}else await revealName()}
  else{T.i++;T.k=1;T.name=false;T.fresh=true;if(T.i>=n){fireworks(10)}else sfx.ok()}
  T.busy=false;render()}
async function skipS(){if(T.busy)return;T.busy=true;await revealName();T.busy=false;render()}

READY=true; applyMute(); render(); refresh(); setInterval(refresh,8000);
</script></body></html>
